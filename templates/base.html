{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Proyecto Inicial{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="container">
            <a href="/" class="logo">Proyecto Inicial</a>

            <nav>
                <ul class="nav-links">
                    <a href="{% url 'home' %}">INICIO</a>
                    <a href="{% url 'cuestionario' %}">CUESTIONARIO</a>
                    <a href="/contacto">CONTACTO</a> <!-- CAMBIAR ESTO DESPUES CON LAS URLS DE CADA UNO -->
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>Proyecto Inicial S2 2026, Paralelo 11, Grupo 12.</p>
        </div>
    </footer>

</body>
</html>
