{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Equipo SOS{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

    <header class="navbar">
        <div class="container">
            <div class="brand">
                <a href="/" class="logo">Equipo SOS</a>

                <span class="logo-subtitle">
                    La plataforma de orientación para estudiantes.
                </span>
            </div>

            <nav>
                <ul class="nav-links">
                    <a href="{% url 'home' %}">INICIO</a>
                    <a href="{% url 'cuestionario' %}">ORIENTACIÓN</a>
                    <a href="/contacto">CONTACTO</a> <!-- CAMBIAR ESTO DESPUES CON LAS URLS DE CADA UNO -->
                </ul>
            </nav>
        </div>
    </header>

    <main class="content">
        {% block content %}
        {% endblock %}
    </main>


    <footer class="footer">
        <div class="container">
            <p>Proyecto Inicial S2 2026, Paralelo 11, Grupo 12.</p>
        </div>
    </footer>

</body>
</html>
